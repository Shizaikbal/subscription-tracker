<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SubDub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">SubDub</span>
    <div class="actions">
      <span class="user-info" id="user-name"></span>
      <button class="btn btn-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="container">
    <div id="alert"></div>

    <div class="grid">
      <div class="card">
        <h2 class="mb">Add a Subscription</h2>
        <form id="sub-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" type="text" required minlength="3" placeholder="Netflix">
          </div>
          <div class="form-group">
            <label for="price">Price</label>
            <input id="price" type="number" required min="0" step="0.01" placeholder="9.99">
          </div>
          <div class="form-group">
            <label for="currency">Currency</label>
            <select id="currency">
              <option value="INR">INR</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="SAR">SAR</option>
            </select>
          </div>
          <div class="form-group">
            <label for="frequency">Frequency</label>
            <select id="frequency">
              <option value="monthly">Monthly</option>
              <option value="weekly">Weekly</option>
              <option value="yearly">Yearly</option>
              <option value="daily">Daily</option>
            </select>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="entertainment">Entertainment</option>
              <option value="productivity">Productivity</option>
              <option value="education">Education</option>
              <option value="health">Health</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="paymentMethod">Payment Method</label>
            <input id="paymentMethod" type="text" required placeholder="Credit Card">
          </div>
          <div class="form-group">
            <label for="startDate">Start Date</label>
            <input id="startDate" type="date" required>
          </div>
          <button class="btn btn-block" type="submit" id="sub-btn">Add Subscription</button>
        </form>
      </div>

      <div>
        <div class="card mb">
          <h2 class="mb">Upcoming Renewals (next 7 days)</h2>
          <div id="upcoming-list"><div class="spinner"></div></div>
        </div>

        <div class="card">
          <div class="actions" style="justify-content: space-between; margin-bottom: 16px;">
            <h2>My Subscriptions</h2>
            <button class="btn btn-ghost" id="test-email-btn" onclick="sendTestEmail()">Send Test Reminder</button>
          </div>
          <div id="sub-list"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
