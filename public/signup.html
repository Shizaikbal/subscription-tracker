<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — SubDub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <h1 class="brand mb">Create your account</h1>
      <div id="alert"></div>
      <form id="signup-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" required minlength="3" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password (min 8 characters)</label>
          <input id="password" type="password" required minlength="8" placeholder="••••••••">
        </div>
        <button class="btn btn-block" type="submit" id="submit-btn">Sign Up</button>
      </form>
      <p class="muted center mt">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    redirectIfAuthed();

    const form = document.getElementById('signup-form');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const data = await api('/auth/sign-up', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        setToken(data.data.token);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
